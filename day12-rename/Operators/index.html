<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    var a = 1
    var b = 2
    var c = 6
    console.log( a + b)
    console.log( a - b)
    console.log(a * b)
    console.log( a**b)
    console.log(a/b)
    console.log(a*b)
    console.log(a+=2)
    let name = "pratik"
    console.log(name)
    console.log(typeof(name))
    console.log(a+b+c)
    console.log(a+c)
    console.log(a/c)

    //Comparsion Operators -
    const p = 10
    const q = 5
    console.log(p > q)
    console.log(q < p)

    const age1 = 35
    const age2 = 40

    console.log(age1 >= age2)
    console.log( age1 <= age2)
    const height1 = 170
    const height2 = "170"
    console.log(height1 == height2) //True
    console.log(height1 === height2) //False

    // Logical Operators : AND , OR , NOT
    const isLoggedIn = true
    const NetflixSub = false
    console.log("Can we watch Movie ", isLoggedIn && NetflixSub) //And
    let member = true
    let bill = 600
    console.log("Discount available", member || bill >= 1000) //OR

    let isLoggedIN = false
    console.log(!isLoggedIN) //NOT

    </script>
</body>
</html>
