<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        //For-loop

        for(let i = 1;i<=10;i++){
            //Body of for loop
            console.log(`The value is ${i}`)
        }

        //While-Loop - Entry Controlled Loop
        //Rule : Condition is True Loops starts and Condition is False Loop Stop

        let count = 1
        while ( count <=5){
            console.log(`Hello While Loop`)
            count++
        }

        //Do While ; you do the task atleast 1 time and then check condition
        let number = 7
        do{
            alert(`Hi I am Notification - Pop up Msg`) 
        }while(number <= 5)
        
        </script>
</body>
</html>
